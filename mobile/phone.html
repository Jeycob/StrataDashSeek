<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Harness"><meta name="theme-color" content="#17243b"><link rel="manifest" href="/phone/manifest.webmanifest"><link rel="apple-touch-icon" href="/phone/icon.png"><title>Strata Harness</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px system-ui,-apple-system,sans-serif;background:#f6f7fb;color:#17243b}body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid #dce1ec;background:white}header strong{flex:1}button{font:inherit;min-height:38px;border:1px solid #c5cfdf;border-radius:9px;background:white;padding:7px 11px;color:#17243b;cursor:pointer}button.primary{background:#235dd7;color:white;border-color:#235dd7}button:disabled{opacity:.5}#status{font-size:12px;width:100%;color:#4b596e}#settings,#pair{padding:14px;background:#fff;max-height:65vh;overflow:auto;border-bottom:1px solid #dce1ec}p{line-height:1.5;margin:6px 0 12px}label{display:block;font-weight:600}input{font:20px monospace;letter-spacing:3px;padding:9px;max-width:170px;border:1px solid #aebbd1;border-radius:7px}#message{font-size:13px;white-space:pre-line}iframe{width:100%;flex:1;min-height:0;border:0;background:white;padding-bottom:env(safe-area-inset-bottom)}[hidden]{display:none!important}.muted{color:#61708a;font-size:13px}a{color:#235dd7}#settings{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;z-index:200;max-height:70dvh;border:1px solid #dce1ec;border-radius:14px;box-shadow:0 12px 48px #17243b44}#close-settings{float:right}#pair-message{color:#a52222;font-size:13px}</style></head><body>
<header id="setup-header"><strong>Strata Harness</strong><button id="settings-button" data-i18n="notifications">Oznámení</button><span id="status">Připojuji…</span></header>
<section id="pair" hidden><h2 data-i18n="phonePairTitle">Propoj tuto aplikaci s Harness serverem</h2><p data-i18n="phonePairHelp">Použij jednorázový párovací kód od správce serveru.</p><form id="pair-form"><label for="pair-code" data-i18n="phonePairCode">Osmimístný kód</label><input id="pair-code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required><button class="primary" type="submit" data-i18n="phonePair">Propojit</button></form><p id="pair-message" role="alert"></p></section>
<section id="settings" role="dialog" aria-labelledby="settings-title" hidden><button data-i18n="close" data-i18n-aria-label="phoneCloseSettings" id="close-settings" aria-label="Zavřít nastavení oznámení">Zavřít</button><h2 id="settings-title" data-i18n="phoneSettingsTitle">Nastavení Harnessu</h2><h3 data-i18n="notifications">Oznámení na iPhonu</h3><p id="install-help" data-i18n="phoneInstallHelp">V Safari zvol Sdílet → Přidat na plochu.</p><p class="muted" data-i18n="phoneNotice">Oznámení neobsahují obsah konverzace.</p><button id="enable" class="primary" data-i18n="phoneEnable" disabled>Povolit oznámení</button> <button id="test" data-i18n="phoneTest" disabled>Test za 5 sekund</button> <button id="disable" data-i18n="phoneDisable" disabled>Vypnout</button><p id="message" role="status"></p><button id="open-app-settings" type="button" data-i18n="phoneApps">Nastavení aplikací a Dockeru</button></section>
<iframe id="harness" title="DeepSeek Harness" hidden></iframe><script src="/phone/i18n.js"></script><script src="/phone/ui-copy.js"></script><script src="/phone/boot.js"></script><script src="/phone/app.js"></script><script src="/phone/monitor.js"></script><script src="/phone/localize.js"></script></body></html>
