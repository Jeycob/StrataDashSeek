<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poznámky</title><style>body{font:16px system-ui;margin:24px auto;max-width:900px;padding:16px}main{display:grid;grid-template-columns:1fr 2fr;gap:20px}input,textarea,button{font:inherit;box-sizing:border-box;max-width:100%;padding:8px}input,textarea{width:100%}label{display:block;margin:8px 0}li{margin:8px 0}textarea{min-height:180px}button{cursor:pointer}@media(max-width:600px){main{display:block}}#status{min-height:24px}</style>
<h1>Poznámky</h1><main><aside><label>Hledat<input id="search"></label><button id="new">Nová poznámka</button><ul id="list" data-testid="note-list"></ul></aside><section><label>Název<input id="title"></label><label>Text<textarea id="body"></textarea></label><button id="save">Uložit</button><button id="delete">Smazat</button><p id="status" data-testid="status" role="status"></p></section></main><script type="module" src="./app.js"></script></html>
