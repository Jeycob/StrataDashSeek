<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Počítadlo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #f5f7fa;
  }
  main {
    text-align: center;
    padding: 2rem 1.5rem;
    background: #171b22;
    border: 1px solid #2a3140;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 1rem; opacity: .8; }
  #value {
    font-size: 4rem;
    font-variant-numeric: tabular-nums;
    margin: 0 0 1.25rem;
    min-width: 6ch;
  }
  #value.negative { color: #ff6b6b; }
  .buttons { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 1.15rem;
    padding: .6rem 1.4rem;
    border-radius: 10px;
    border: 1px solid #3a4356;
    background: #232a36;
    color: inherit;
    cursor: pointer;
  }
  button:hover { background: #2c3543; }
  button:active { transform: translateY(1px); }
  #reset { border-color: #5b4630; background: #2b2418; }
  #reset:hover { background: #382f1f; }
</style>
</head>
<body>
<main>
  <h1>Počítadlo</h1>
  <p id="value" aria-live="polite">0</p>
  <div class="buttons">
    <button id="plus" type="button" aria-label="Přičíst">+</button>
    <button id="minus" type="button" aria-label="Odečíst">−</button>
    <button id="reset" type="button">Reset</button>
  </div>
</main>
<script>
  let value = 0;
  const out = document.getElementById('value');

  function render() {
    out.textContent = String(value);
    out.classList.toggle('negative', value < 0);
  }

  document.getElementById('plus').addEventListener('click', () => {
    value += 1;
    render();
  });

  document.getElementById('minus').addEventListener('click', () => {
    value -= 1;
    render();
  });

  document.getElementById('reset').addEventListener('click', () => {
    value = 0;
    render();
  });

  render();
</script>
</body>
</html>
