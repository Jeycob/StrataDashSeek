name: Output-limit fixture diagnostics

on:
  push:
    branches: ['diagnostics/output-limit-20261124']

permissions:
  contents: read

jobs:
  sdk:
    name: Output-limit SDK TAP diagnostics
    if: github.ref == 'refs/heads/diagnostics/output-limit-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      HOMEAI_RUNTIME: ${{ github.workspace }}/runtime
      EFFICIENCY_SDK_ROOT: ${{ github.workspace }}/runtime/node_modules
      HARNESS_NATIVE_CLI: ${{ github.workspace }}/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify diagnostic source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 6fc1de83429af312eca97c9cb89b6aa17590d0f8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/output-limit-diagnostic.yml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install the pinned SDK
        run: npm ci --prefix runtime --no-audit --no-fund
      - name: Capture SDK TAP and annotate exact failures
        shell: bash
        run: |
          tap="$RUNNER_TEMP/output-limit-sdk.tap"
          test_exit=0
          node --test --test-reporter=tap --test-timeout=120000 runtime/output-continuation/continuation.test.mjs >"$tap" 2>&1 || test_exit=$?
          node --input-type=module - "$tap" "$test_exit" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { stripVTControlCharacters } from 'node:util';

          const [, , path, exitCode] = process.argv;
          const lines = readFileSync(path, 'utf8').split(/\r?\n/);
          const fixture = 'runtime/output-continuation/continuation.test.mjs';
          const escapeData = text => text.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          const escapeProperty = text => escapeData(text).replaceAll(':', '%3A').replaceAll(',', '%2C');
          function redact(value, limit) {
            return stripVTControlCharacters(value)
              .replace(/\b[a-z][a-z\d+.-]*:\/\/[^\s"'<>]+/gi, '[redacted URL]')
              .replace(/\bwww\.[a-z\d.-]+(?:\/[^\s"'<>]*)?/gi, '[redacted URL]')
              .replace(/\b(?:bearer|basic)\s+[a-z\d._+/=~-]+/gi, '[redacted authorization]')
              .replace(/\b[a-z\d_-]*(?:authorization|(?:api|private)[_-]?key|(?:access|refresh)[_-]?token|secret|password)[a-z\d_-]*\b["']?\s*[:=]\s*["']?[^\s"',;]+/gi, '[redacted field]')
              .replace(/\b(?:gh[pousr]_|github_pat_|sk-)[a-z\d_-]+/gi, '[redacted credential]')
              .slice(0, limit);
          }
          function annotate(title, details) {
            const message = details.length ? details.map(line => redact(line.trim(), 260)).join('\n') : 'No nested TAP details.';
            console.log('::error file=' + fixture + ',title=' + escapeProperty(redact(title, 170)) + '::' + escapeData(redact(message, 1400)));
          }

          const notOk = /^\s*not ok\s+\d+\b/;
          const field = /^(\s*)(?:failureType|error|code|location|expected|actual|operator):\s*/;
          const failures = [];
          for (let index = 0; index < lines.length && failures.length < 8; index++) {
            if (!notOk.test(lines[index])) continue;
            const title = lines[index].trim();
            const details = [];
            let fieldIndent = null;
            for (let item = index + 1; item < lines.length && item <= index + 60 && details.length < 13; item++) {
              const row = lines[item];
              if (notOk.test(row) || /^\s*(?:\.\.\.|ok\s+\d+\b|# Subtest:)\s*/.test(row)) break;
              const match = row.match(field);
              if (match) {
                fieldIndent = match[1].length;
                details.push(row);
              } else if (row.trim()) {
                const indent = row.match(/^\s*/)[0].length;
                if (fieldIndent !== null && indent > fieldIndent) details.push(row);
                else fieldIndent = null;
              }
            }
            failures.push({ title, details });
          }

          const fatal = [];
          const crash = /\b(?:uncaught(?:exception)?|unhandled\s*rejection|AssertionError|ERR_ASSERTION|ERR_MODULE_NOT_FOUND|TypeError|ReferenceError|SyntaxError)\b|\bdsh\b.*\bfatal\b/i;
          for (let index = 0; index < lines.length && fatal.length < 10; index++) {
            const row = lines[index];
            if (!/^\s*#\s*/.test(row) || !crash.test(row)) continue;
            for (const context of lines.slice(index, index + 4)) {
              if (!/^\s*#\s*/.test(context) || /^\s*# Subtest:/.test(context)) break;
              if (!fatal.includes(context) && fatal.length < 10) fatal.push(context);
            }
          }

          for (const { title, details } of failures) annotate(title, details);
          if (fatal.length) annotate('SDK stderr and uncaught assertions', fatal);
          if (exitCode !== '0' && !failures.length && !fatal.length) {
            annotate('SDK fixture process failed', ['TAP had no matching failure lines. Exit status: ' + exitCode]);
          }
          console.log('SDK TAP process exit=' + exitCode + ', failed TAP entries=' + failures.length + ', crash diagnostic lines=' + fatal.length);
          NODE
          exit "$test_exit"
