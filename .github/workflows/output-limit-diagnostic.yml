name: Verify prior output continuation TAP counts

on:
  push:
    branches: ['diagnostics/output-limit-20261124']

permissions:
  contents: read
  actions: read

jobs:
  artifact:
    name: Verify ${{ matrix.source }} output continuation TAP counts
    if: github.ref == 'refs/heads/diagnostics/output-limit-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: Main
            run: '45420044268'
            artifact: release-checks-4e0a6e1d3bdffd44703b1a03879a176e6f3f7548
          - source: Basalt
            run: '45417588777'
            artifact: release-checks-fbbfaf0595bcf1164204551601b51dc9b2bae957
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify diagnostic source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = d7e9293e9e428c694fe527027823803ab9e590a3
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/output-limit-diagnostic.yml
      - name: Download only the named prior release evidence archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/output-limit-archive
          skip-decompress: true
      - name: Verify allowlisted TAP counts
        env:
          RUN_LABEL: ${{ matrix.source }}
          SOURCE_RUN: ${{ matrix.run }}
        run: |
          python3 - "$RUNNER_TEMP/output-limit-archive" <<'PY'
          import os
          import pathlib
          import re
          import sys
          import zipfile

          source = os.environ["RUN_LABEL"]
          run = os.environ["SOURCE_RUN"]
          if {"Main": "45420044268", "Basalt": "45417588777"}.get(source) != run:
              raise SystemExit("Unexpected source run")
          suites = [
              ("SDK continuation", "runtime/output-continuation/continuation.test.mjs", 7),
              ("Chromium continuation", "runtime/output-continuation/continuation.browser.test.cjs", 1),
          ]
          if source == "Basalt":
              suites.append(("Basalt launcher", "experiments/basalt-inkling/launcher.test.cjs", 2))

          fields = ("tests", "pass", "fail", "cancelled", "skipped", "todo")
          summary = re.compile(rb"^#[ \t]+(tests|pass|fail|cancelled|skipped|todo)[ \t]+([0-9]{1,6})[ \t]*\r?$", re.MULTILINE)
          limit = 1024 * 1024

          def counts_for(archive, fixture):
              if archive is None:
                  return {}
              member = "portable/" + fixture.replace("/", "__") + ".log"
              matches = [entry for entry in archive.infolist() if entry.filename == member]
              if len(matches) != 1 or not 0 < matches[0].file_size <= limit:
                  return {}
              try:
                  with archive.open(matches[0]) as stream:
                      log = stream.read(limit + 1)
              except (OSError, RuntimeError, zipfile.BadZipFile):
                  return {}
              if len(log) > limit:
                  return {}
              pairs = summary.findall(log)
              counts = {key.decode("ascii"): int(value) for key, value in pairs}
              return counts if len(pairs) == len(counts) == len(fields) else {}

          def report(archive):
              success = True
              for name, fixture, expected in suites:
                  counts = counts_for(archive, fixture)
                  valid = counts == {"tests": expected, "pass": expected, "fail": 0, "cancelled": 0, "skipped": 0, "todo": 0}
                  level = "notice" if valid else "error"
                  values = ", ".join(field + "=" + str(counts.get(field, "unavailable")) for field in fields)
                  print(f"::{level} file={fixture},title={source} {run} {name} TAP::{values}")
                  success = success and valid
              return success

          root = pathlib.Path(sys.argv[1])
          try:
              archives = list(root.iterdir())
              if len(archives) != 1 or not archives[0].is_file() or archives[0].is_symlink():
                  raise ValueError
              archive = zipfile.ZipFile(archives[0])
          except (OSError, ValueError, zipfile.BadZipFile):
              report(None)
              raise SystemExit(1)
          with archive:
              raise SystemExit(0 if report(archive) else 1)
          PY
