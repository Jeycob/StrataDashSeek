<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Převodník °C → °F</title>
<style>
  :root { color-scheme: light dark; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  main {
    width: min(420px, 92vw);
    padding: 28px 32px;
    border-radius: 16px;
    background: #1e293b;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 4px; font-size: 1.35rem; }
  p.hint { margin: 0 0 20px; color: #94a3b8; font-size: .9rem; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: 1px solid #475569;
    background: #0b1220;
    color: inherit;
  }
  input[type="number"]:focus { outline: 2px solid #38bdf8; border-color: transparent; }
  output {
    display: block;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #0b1220;
    border: 1px solid #334155;
    font-size: 1.25rem;
    font-variant-numeric: tabular-nums;
  }
  .error { color: #fca5a5; font-size: .9rem; margin-top: 10px; min-height: 1.2em; }
  .note { margin-top: 14px; color: #64748b; font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>°C → °F</h1>
  <p class="hint">Výsledek se přepočítá okamžitě při změně vstupu.</p>

  <label for="c">Teplota ve °C</label>
  <input id="c" type="number" step="0.1" value="0" inputmode="decimal" autofocus>

  <output id="f" for="c">32,00 °F</output>
  <div class="error" id="err" role="alert"></div>

  <p class="note">Vzorec: °F = °C × 9/5 + 32</p>
</main>

<script>
(function () {
  const input = document.getElementById('c');
  const out = document.getElementById('f');
  const err = document.getElementById('err');

  function fmt(n) {
    return n.toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function update() {
    const raw = input.value.trim();
    if (raw === '') {
      err.textContent = 'Zadej hodnotu ve °C.';
      out.textContent = '—';
      return;
    }
    const c = Number(raw.replace(',', '.'));
    if (!Number.isFinite(c)) {
      err.textContent = 'Hodnota není platné číslo.';
      out.textContent = '—';
      return;
    }
    err.textContent = '';
    out.textContent = fmt(c * 9 / 5 + 32) + ' °F';
  }

  // Okamžitý převod při každé změně vstupu
  input.addEventListener('input', update);
  input.addEventListener('change', update);

  update();
})();
</script>
</body>
</html>
